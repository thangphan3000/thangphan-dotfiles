# Nord theme for tmux

# Status bar
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-right-length "100"
set -g status-left-length "100"
set -g status-style "none,bg=#2e3440"

# Messages
set -g message-style "fg=#d8dee9,bg=#3b4252"
set -g message-command-style "fg=#d8dee9,bg=#3b4252"

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Window status
setw -g window-status-activity-style "none,fg=#88c0d0,bg=#2e3440"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#d8dee9,bg=#2e3440"

# Status left: [session] [time]
set -g status-left "#[fg=#2e3440,bg=#88c0d0] #S #[fg=#88c0d0,bg=#3b4252,nobold,nounderscore,noitalics]#[fg=#d8dee9,bg=#3b4252] %R #[bg=#2e3440,fg=#3b4252,nobold,nounderscore,noitalics]"

# Status right: [day] [hostname]
set -g status-right "#[fg=#3b4252]#[fg=#d8dee9,bg=#3b4252] %a #[fg=#88c0d0,bg=#3b4252,nobold,nounderscore,noitalics]#[fg=#2e3440,bg=#88c0d0] #H #{prefix_highlight}"

# Window status format
setw -g window-status-format "#[fg=#2e3440,bg=#2e3440,nobold,nounderscore,noitalics]#[fg=#d8dee9] #I  #W #[fg=#2e3440,bg=#2e3440,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[bg=#2e3440,fg=#88c0d0]#[fg=#2e3440,bg=#88c0d0] #I  #W  #F #[bg=#2e3440,fg=#88c0d0,nobold,nounderscore,noitalics]"
