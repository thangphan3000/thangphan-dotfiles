# Catppuccin Mocha theme for tmux

# Status bar
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-right-length "100"
set -g status-left-length "100"
set -g status-style "none,bg=#1e1e2e"

# Messages
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Window status
setw -g window-status-activity-style "none,fg=#cba6f7,bg=#1e1e2e"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#cdd6f4,bg=#1e1e2e"

# Status left: [session] [time]
set -g status-left "#[fg=#11111b,bg=#cba6f7] #S #[fg=#cba6f7,bg=#313244,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#313244] %R #[bg=#1e1e2e,fg=#313244,nobold,nounderscore,noitalics]"

# Status right: [day] [hostname]
set -g status-right "#[fg=#313244]#[fg=#cdd6f4,bg=#313244] %a #[fg=#cba6f7,bg=#313244,nobold,nounderscore,noitalics]#[fg=#11111b,bg=#cba6f7] #H #{prefix_highlight}"

# Window status format
setw -g window-status-format "#[fg=#1e1e2e,bg=#1e1e2e,nobold,nounderscore,noitalics]#[fg=#cdd6f4] #I  #W #[fg=#1e1e2e,bg=#1e1e2e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[bg=#1e1e2e,fg=#cba6f7]#[fg=#11111b,bg=#cba6f7] #I  #W  #F #[bg=#1e1e2e,fg=#cba6f7,nobold,nounderscore,noitalics]"
