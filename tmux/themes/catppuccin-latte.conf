# Catppuccin Latte theme for tmux

# Status bar
set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-right-length "0"
set -g status-left-length "0"
set -g status-style "none,bg=#eff1f5"

# Messages
set -g message-style "fg=#4c4f69,bg=#ccd0da"
set -g message-command-style "fg=#4c4f69,bg=#ccd0da"

# Pane borders
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#8839ef"

# Window status
setw -g window-status-activity-style "none,fg=#8839ef,bg=#eff1f5"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#4c4f69,bg=#eff1f5"

set -g status-left ""
set -g status-right ""

# Window status format
setw -g window-status-format "#[fg=#4c4f69,bg=#eff1f5] #I: #W "
setw -g window-status-current-format "#[fg=#8839ef,bg=#eff1f5] #I: #W "
