# Catppuccin Latte theme for tmux

# Status bar
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-right-length "100"
set -g status-left-length "100"
set -g status-style "none,bg=#eff1f5"

# Messages
set -g message-style "fg=#4c4f69,bg=#ccd0da"
set -g message-command-style "fg=#4c4f69,bg=#ccd0da"

# Pane borders
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"

# Window status
setw -g window-status-activity-style "none,fg=#1e66f5,bg=#eff1f5"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#4c4f69,bg=#eff1f5"

# Status left: [session] [time]
set -g status-left "#[fg=#eff1f5,bg=#1e66f5] #S #[fg=#1e66f5,bg=#ccd0da,nobold,nounderscore,noitalics]#[fg=#4c4f69,bg=#ccd0da] %R #[bg=#eff1f5,fg=#ccd0da,nobold,nounderscore,noitalics]"

# Status right: [day] [hostname]
set -g status-right "#[fg=#ccd0da]#[fg=#4c4f69,bg=#ccd0da] %a #[fg=#1e66f5,bg=#ccd0da,nobold,nounderscore,noitalics]#[fg=#eff1f5,bg=#1e66f5] #H #{prefix_highlight}"

# Window status format
setw -g window-status-format "#[fg=#eff1f5,bg=#eff1f5,nobold,nounderscore,noitalics]#[fg=#4c4f69] #I  #W #[fg=#eff1f5,bg=#eff1f5,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[bg=#eff1f5,fg=#1e66f5]#[fg=#eff1f5,bg=#1e66f5] #I  #W  #F #[bg=#eff1f5,fg=#1e66f5,nobold,nounderscore,noitalics]"
